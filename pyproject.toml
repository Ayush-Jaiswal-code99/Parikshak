[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parikshak"
version = "0.1.0"
description = "On-board procedure-compliance witness for crewed missions"
requires-python = ">=3.11"

dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
perception = [
    "opencv-python-headless>=4.9",
    "mediapipe>=0.10",
    "onnxruntime>=1.17",
    "pupil-apriltags>=1.0.4",
]

gui = [
    "PySide6>=6.6",
]

web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
parikshak-validate = "parikshak.pdl.cli:main"
parikshak-run = "parikshak.run:main"

[tool.setuptools.packages.find]
include = ["parikshak*"]

[tool.vercel]
entrypoint = "demo.server:app"
